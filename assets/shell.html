<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6e6c6"><meta name="description" content="我的瑞典语学习资源站：播客、YouTube、电影、课程与学习笔记。"><title>Svenska Hub · 我的瑞典语学习资源站</title><style>__CSS__</style></head><body><svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden" xmlns="http://www.w3.org/2000/svg"><defs><image id="plush-avatar-sheet" href="__AVATAR_SHEET__" width="300" height="300"/></defs></svg><div class="app"><aside id="sidebar" class="sidebar" aria-label="资源分类"><div class="sidebar-top"><button class="side-home" id="home" title="首页" aria-label="首页"><svg class="icon home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 11 9-8 9 8M6 9v12h12V9M10 21v-7h4v7"/></svg><span class="home-label">首页</span></button><button id="sidebarToggle" class="sidebar-toggle" aria-controls="sidebar" aria-expanded="true" aria-label="收起侧栏"></button></div><nav id="nav" aria-label="学习资源导航"></nav><div class="side-bottom"><i lang="sv">Ett litet framsteg<br>varje dag</i><br>每天一点小进步</div></aside><button class="nav-overlay" id="navOverlay" aria-label="关闭导航"></button><main class="main"><div class="top" id="libraryToolbar"><button class="btn mobilemenu" id="menu" aria-controls="sidebar" aria-expanded="false">分类</button><label class="searchbox"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" class="search" aria-label="搜索当前分类中的资源和笔记" placeholder="搜索当前分类：资源、笔记、关键词…" type="search"></label><div class="actions"><details class="backup-menu"><summary class="btn">数据备份</summary><div class="backup-panel"><strong>保存你的资源与笔记</strong><p>内容保存在当前浏览器。换设备前，可保存备份文件，再在新设备恢复。</p><button class="btn" id="export">保存备份文件</button><button class="btn" id="importBtn">从备份文件恢复</button><small>恢复会替换当前资源与笔记，请先保存现有备份。</small></div></details><input id="importFile" type="file" accept="application/json,.json" hidden><button class="btn primary" id="add">添加资源</button></div></div><div id="content" class="board"></div><div class="detail-page" id="notesback" hidden><section class="resource-detail" aria-labelledby="notesTitle"><div id="detailMascot" class="detail-mascot" aria-hidden="true"></div><div class="notes-dialog-top"><button class="btn" id="notesClose" aria-label="返回资源列表">← 返回列表</button></div><header class="notes-resource"><div id="notesCover" class="notes-cover"></div><div><h1 id="notesTitle" tabindex="-1"></h1><p id="notesDescription"></p><a class="btn" id="notesVisit" target="_blank" rel="noopener noreferrer">访问原网站 ↗</a></div></header><section id="shadowingGuide" class="shadowing-guide" hidden></section><section id="sfiApplications" class="sfi-applications" hidden></section><section id="recentEpisodes" class="recent-episodes" hidden></section><section id="channelVideos" class="channel-videos" hidden></section><section id="musicStudy" class="music-study" hidden></section><section class="note-composer"><h2>我的笔记</h2><form id="noteForm"><input id="noteHeading" type="hidden"><input id="noteEpisode" type="hidden"><textarea id="noteText" required aria-label="学习笔记" placeholder="随手记下生词、喜欢的句子，或今天的收获…"></textarea><div class="modal-actions"><button type="button" class="btn" id="noteCancelEdit" hidden>取消修改</button><button type="submit" class="btn primary" id="noteSubmit">保存笔记</button></div></form></section><section id="noteHistory" hidden><div class="section-row"><h2>已保存的笔记</h2><span class="note" id="notesCount"></span></div><div id="noteEntries"></div></section></section></div><footer class="footer">Svenska Hub · 一点一点，学进生活里。<br>数据保存在当前浏览器 · 换设备或更换文件前，请导出 JSON 备份</footer></main></div><div class="modalback" id="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">添加新资源</h2><p class="note">填上名称和网站链接，选好分类就可以保存。等级和说明可以稍后再补。</p><form id="resourceForm"><input type="hidden" id="editid"><div class="field"><label for="title">资源标题 *</label><input id="title" required maxlength="300" placeholder="例如：Simple Swedish Podcast"></div><div class="field"><label for="category">所属分类</label><select id="category"></select></div><div class="field"><label for="subcategory">子分类</label><select id="subcategory"></select></div><div class="field"><label for="url">资源链接（个人笔记可留空）</label><input id="url" type="url" pattern="https?://.*" placeholder="https://..."></div><div class="field"><label for="level">适用等级</label><select id="level"><option>全部</option><option>A1–A2</option><option>B1–B2</option><option>C1–C2</option></select></div><div class="field"><label for="description">说明 / 学习笔记</label><textarea id="description" placeholder="这是什么资源？今天学到了什么？"></textarea></div><div class="modal-actions"><button type="button" class="btn danger" id="deleteResource" hidden>删除资源</button><button type="button" class="btn" id="cancel">取消</button><button class="btn primary" type="submit">保存资源</button></div></form><p class="note">自己添加的资源和学习笔记会保存在当前浏览器，可在顶部“数据备份”中保存。</p></section></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script>__DATA__
